{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>Delete Tag</title>

</head>
<body>

    <div class="navbar">
        
        <a href="/">Home</a>
        <a href="/games/">All Games</a>
        <a href="/tags/">Tags</a>

        {% if user.is_authenticated %}

            <form action="{% url 'logout' %}" method="POST" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="button">Log Out</button>
            </form>

        {% else %}

            <a href="{% url 'login' %}" class="button">Log In</a>
            <a href="{% url 'signup' %}" class="button">Sign Up</a>

        {% endif %}

    </div>

    <div class="game-card">
        <h1>Delete Tag</h1>

        <p>Are you sure you want to delete {{ tag.name }}?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="button button-delete">Yes, Delete</button>
        </form>

        <br>

        <a href="{% url 'tag-index' %}" class="button">Cancel</a>
    </div>

</body>
</html>
