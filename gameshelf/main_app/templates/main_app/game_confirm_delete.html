{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">     
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>Delete Game</title>

</head>
<body>

    <div class="game-card">

        <h1>Delete Game</h1>

        <h2>Are you sure you want to delete {{ game.title }}?</h2>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="button button-delete">Yes Delete</button>

        </form>

    </div>

</body>
</html>
