{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>Sign Up</title>
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/games/">All Games</a>
        <a href="/tags/">Tags</a>
        <a href="{% url 'login' %}">Log In</a>
    </div>

    <div class="game-card">
        <h1>Sign Up</h1>

        <p>{{ error_message }}</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="button">Sign Up</button>
        </form>
    </div>

</body>
</html>
